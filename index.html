<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Football Stats App (Static)</title>
    <style>
      body{font-family:Inter, system-ui, -apple-system, sans-serif;padding:24px;background:#071124;color:#e6eef8}
      .card{background:#071a2b;padding:12px;border-radius:8px;margin-bottom:12px}
      h1{color:#00f0ff}
      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
      .team{padding:12px;background:linear-gradient(180deg,#081728,#021226);border-radius:10px}
    </style>
  </head>
  <body>
    <h1>Football Stats App (Static)</h1>
    <p>This static page loads `public/teams.json` so the UI appears even when server APIs are unavailable.</p>
    <div id="app">
      <div class="card"><strong>Loading teams…</strong></div>
    </div>

    <script>
      async function load() {
        try {
          const res = await fetch('/teams.json')
          const teams = await res.json()
          const container = document.getElementById('app')
          const grid = document.createElement('div')
          grid.className = 'grid'
          teams.forEach(t => {
            const el = document.createElement('div')
            el.className = 'team'
            el.innerHTML = `<div style="font-weight:700">${t.name}</div><div class="smallMuted">${t.league} — ${t.country || ''}</div>`
            grid.appendChild(el)
          })
          container.innerHTML = ''
          container.appendChild(grid)
        } catch (e) {
          document.getElementById('app').innerHTML = '<div class="card">Failed to load teams.</div>'
        }
      }
      load()
    </script>
  </body>
</html>
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Football Stats App</title>
</head>
<body>
  <div id="root"></div>
</body>
</html>
