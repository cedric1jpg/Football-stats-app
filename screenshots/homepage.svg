<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#071029"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#g)" />
  <text x="48" y="72" fill="#00ffcc" font-family="Segoe UI, Roboto, Arial" font-size="28">Football-stats-app — Home</text>
  <g transform="translate(48,110)">
    <!-- cards -->
    <rect x="0" y="0" width="1040" height="86" rx="8" fill="#071a2a" opacity="0.9"/>
    <text x="18" y="52" fill="#cfeff1" font-size="20">Search • Season: 2023 • Showing 20 teams</text>

    <!-- grid of small cards -->
    <g transform="translate(0,110)">
      <!-- 4 columns x 4 rows preview -->
      <g fill="#081826" stroke="#08334a" stroke-width="1">
        <!-- draw some cards -->
        <rect x="0" y="0" width="260" height="120" rx="10" />
        <rect x="290" y="0" width="260" height="120" rx="10" />
        <rect x="580" y="0" width="260" height="120" rx="10" />
        <rect x="870" y="0" width="260" height="120" rx="10" />

        <rect x="0" y="150" width="260" height="120" rx="10" />
        <rect x="290" y="150" width="260" height="120" rx="10" />
        <rect x="580" y="150" width="260" height="120" rx="10" />
        <rect x="870" y="150" width="260" height="120" rx="10" />
      </g>

      <text x="16" y="28" fill="#7ee7df" font-size="16">Manchester United</text>
      <text x="306" y="28" fill="#7ee7df" font-size="16">Liverpool</text>
      <text x="596" y="28" fill="#7ee7df" font-size="16">Arsenal</text>
      <text x="886" y="28" fill="#7ee7df" font-size="16">Chelsea</text>
    </g>
  </g>
  <rect x="48" y="570" width="1100" height="80" rx="6" fill="#021218" opacity="0.6"/>
  <text x="60" y="618" fill="#9ff2e9" font-size="14">Footer · Built with Next.js + TypeScript</text>
</svg>