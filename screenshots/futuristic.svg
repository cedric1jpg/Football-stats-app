<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#02041a"/>
      <stop offset="100%" stop-color="#00121f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)" />
  <text x="48" y="64" fill="#39ffde" font-family="Segoe UI, Roboto" font-size="28">Futuristic Dashboard</text>
  <g transform="translate(48,120)">
    <rect x="0" y="0" width="1100" height="440" rx="12" fill="#041726" stroke="#0b4c5b" />
    <text x="28" y="40" fill="#bffbf0" font-size="18">Live performance • Neon HUD • Team cards</text>

    <!-- HUD bars -->
    <g transform="translate(28,80)" fill="#03ffd6" font-size="12" opacity="0.9">
      <rect x="0" y="0" width="320" height="12" rx="6" fill="#023442"/>
      <rect x="0" y="28" width="520" height="12" rx="6" fill="#023442"/>
      <rect x="0" y="56" width="220" height="12" rx="6" fill="#023442"/>
    </g>

    <g transform="translate(360,140)" fill="#8ff1e3" font-size="16">
      <text x="0" y="0">Team: Arsenal</text>
      <text x="0" y="28">Attack: 1.9 • Defense: 1.2 • Rating: 8.7</text>
    </g>
  </g>
</svg>